<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78A6C8"/>
      <stop offset="50%" stop-color="#B8D5E5"/>
      <stop offset="100%" stop-color="#E9D6BE"/>
    </linearGradient>
    <linearGradient id="stoneWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9A873"/>
      <stop offset="50%" stop-color="#BA7E47"/>
      <stop offset="100%" stop-color="#8F5726"/>
    </linearGradient>
    <linearGradient id="stoneShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E6838"/>
      <stop offset="100%" stop-color="#6E3E17"/>
    </linearGradient>
    <linearGradient id="stoneLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C396"/>
      <stop offset="100%" stop-color="#C4905D"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A9A5B"/>
      <stop offset="30%" stop-color="#6F7C47"/>
      <stop offset="100%" stop-color="#4B5330"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>
  
  <!-- Distant hill / landscape -->
  <path d="M0,450 Q200,410 400,430 T800,440 L800,600 L0,600 Z" fill="#B4A188" opacity="0.5"/>
  <path d="M0,470 Q250,440 500,460 T800,470 L800,600 L0,600 Z" fill="url(#groundGrad)"/>

  <!-- Pattadakal Virupaksha Temple Complex -->
  <!-- Temple Base Plinth -->
  <rect x="180" y="440" width="460" height="40" fill="url(#stoneShadow)" rx="2"/>
  <rect x="170" y="470" width="480" height="20" fill="url(#stoneWarm)"/>
  <rect x="150" y="485" width="520" height="15" fill="url(#stoneShadow)"/>

  <!-- Mandapa (Hall) Structure -->
  <rect x="220" y="340" width="220" height="105" fill="url(#stoneWarm)" filter="url(#shadow)"/>
  <!-- Mandapa roof tiers -->
  <polygon points="210,340 450,340 430,310 230,310" fill="url(#stoneLight)"/>
  <polygon points="225,310 435,310 420,290 240,290" fill="url(#stoneWarm)"/>
  
  <!-- Mandapa Pillars & Niches -->
  <g fill="url(#stoneShadow)">
    <rect x="240" y="360" width="14" height="80" rx="1"/>
    <rect x="280" y="360" width="14" height="80" rx="1"/>
    <rect x="320" y="360" width="14" height="80" rx="1"/>
    <rect x="360" y="360" width="14" height="80" rx="1"/>
    <rect x="400" y="360" width="14" height="80" rx="1"/>
  </g>
  
  <!-- Vimana / Shikhara (Main Dravidian Tower) -->
  <rect x="420" y="320" width="200" height="125" fill="url(#stoneShadow)" filter="url(#shadow)"/>
  <!-- Tier 1 -->
  <polygon points="405,320 635,320 615,260 425,260" fill="url(#stoneWarm)"/>
  <!-- Kudus (arched motifs on tier 1) -->
  <g fill="url(#stoneLight)">
    <circle cx="450" cy="290" r="10"/>
    <circle cx="520" cy="290" r="12"/>
    <circle cx="590" cy="290" r="10"/>
  </g>
  <!-- Tier 2 -->
  <polygon points="420,260 620,260 600,200 440,200" fill="url(#stoneShadow)"/>
  <g fill="url(#stoneLight)">
    <circle cx="470" cy="230" r="9"/>
    <circle cx="520" cy="230" r="10"/>
    <circle cx="570" cy="230" r="9"/>
  </g>
  <!-- Tier 3 -->
  <polygon points="435,200 605,200 585,150 455,150" fill="url(#stoneWarm)"/>
  <!-- Griva (Neck) -->
  <rect x="475" y="135" width="90" height="20" fill="url(#stoneShadow)" rx="3"/>
  <!-- Shikhara Dome (Kalasha cap) -->
  <path d="M465,135 Q520,80 575,135 Z" fill="url(#stoneLight)"/>
  <!-- Kalasha pinnacle -->
  <path d="M515,85 L525,85 L522,60 L518,60 Z" fill="#D4A574"/>
  <circle cx="520" cy="57" r="4" fill="#E8C396"/>

  <!-- Nandi Pavilion (Foreground Left) -->
  <rect x="90" y="420" width="90" height="60" fill="url(#stoneShadow)" filter="url(#shadow)"/>
  <polygon points="80,420 190,420 180,390 90,390" fill="url(#stoneWarm)"/>
  <rect x="100" y="435" width="8" height="45" fill="url(#stoneLight)"/>
  <rect x="160" y="435" width="8" height="45" fill="url(#stoneLight)"/>
  <!-- Nandi silhouette inside -->
  <ellipse cx="135" cy="455" rx="16" ry="10" fill="#3D2314"/>
  <circle cx="122" cy="448" r="7" fill="#3D2314"/>

  <!-- Architectural carvings & textured details -->
  <line x1="180" y1="460" x2="640" y2="460" stroke="#7A4419" stroke-width="2" stroke-dasharray="8,4"/>
  <line x1="220" y1="350" x2="440" y2="350" stroke="#E8C396" stroke-width="3"/>

  <!-- Banner Tag -->
  <rect x="30" y="30" width="270" height="48" rx="8" fill="#1A1A1A" opacity="0.85"/>
  <text x="45" y="52" fill="#E8C396" font-family="Georgia, serif" font-size="14" font-weight="bold">PATTADAKAL</text>
  <text x="45" y="68" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">Virupaksha Temple • c. 740 CE</text>
</svg>
